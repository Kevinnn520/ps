name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Instalar VS Code y Rclone
        run: |
          choco install rclone -y
          winget install --id Microsoft.VisualStudioCode -e --accept-source-agreements --accept-package-agreements

      - name: Restaurar sesiones, extensiones y proyectos en usuario RDP
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          Set-Content -Path "C:\rclone.conf" -Value $env:RCLONE_CONFIG_DATA
          
          $rdpProfile = "C:\Users\RDP"
          New-Item -ItemType Directory -Path "$rdpProfile\AppData\Roaming\Mozilla\Firefox" -Force
          New-Item -ItemType Directory -Path "$rdpProfile\AppData\Roaming\Code\User" -Force
          New-Item -ItemType Directory -Path "$rdpProfile\Desktop" -Force
          New-Item -ItemType Directory -Path "$rdpProfile\Documents" -Force

          # Descargar desde Google Drive usando explícitamente C:\rclone.conf
          rclone copy gdrive:Backup_GitHub_PC/Firefox_Roaming "$rdpProfile\AppData\Roaming\Mozilla\Firefox" --config "C:\rclone.conf" --create-empty-src-dirs -v
          rclone copy gdrive:Backup_GitHub_PC/VSCode_User "$rdpProfile\AppData\Roaming\Code\User" --config "C:\rclone.conf" --create-empty-src-dirs -v
          rclone copy gdrive:Backup_GitHub_PC/Desktop "$rdpProfile\Desktop" --config "C:\rclone.conf" --create-empty-src-dirs -v
          rclone copy gdrive:Backup_GitHub_PC/Documents "$rdpProfile\Documents" --config "C:\rclone.conf" --create-empty-src-dirs -v

          # Dar control total al usuario RDP sobre su carpeta
          icacls "$rdpProfile" /grant "RDP:(OI)(CI)F" /T /Q

          if (Test-Path "$rdpProfile\Desktop\vscode_extensions.txt") {
            Get-Content "$rdpProfile\Desktop\vscode_extensions.txt" | ForEach-Object {
              & "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd" --extensions-dir "$rdpProfile\.vscode\extensions" --install-extension $_ --force
            }
          }

      - name: Programar guardado automatico cada 30 minutos y antes de las 6 horas
        run: |
          $script = @'
          $rdpProfile = "C:\Users\RDP"
          while ($true) {
            Start-Sleep -Seconds 1800
            rclone sync "$rdpProfile\Desktop" gdrive:Backup_GitHub_PC/Desktop --config "C:\rclone.conf" --max-size 100M
            rclone sync "$rdpProfile\Documents" gdrive:Backup_GitHub_PC/Documents --config "C:\rclone.conf" --max-size 100M
            rclone sync "$rdpProfile\AppData\Roaming\Code\User" gdrive:Backup_GitHub_PC/VSCode_User --config "C:\rclone.conf"
          }
          '@
          Set-Content -Path "C:\backup_auto.ps1" -Value $script
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -File C:\backup_auto.ps1"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
