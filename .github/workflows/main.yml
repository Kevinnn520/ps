name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          Write-Host "Usuario RDP creado"

      - name: Instalar rclone + VS Code
        run: |
          # Instalar rclone (método confiable)
          $rcloneDir = "C:\rclone"
          New-Item -ItemType Directory -Path $rcloneDir -Force | Out-Null
          
          $url = "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          $zip = "$env:TEMP\rclone.zip"
          
          Write-Host "Descargando rclone..."
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\rclone-extract" -Force
          
          $extracted = Get-ChildItem "$env:TEMP\rclone-extract" -Directory | Select-Object -First 1
          Copy-Item "$($extracted.FullName)\rclone.exe" -Destination "$rcloneDir\rclone.exe" -Force
          
          # Agregar al PATH del sistema
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*C:\rclone*") {
            [Environment]::SetEnvironmentVariable("Path", "$machinePath;C:\rclone", "Machine")
          }
          
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          Write-Host "rclone instalado:"
          & "C:\rclone\rclone.exe" version
          
          # Instalar VS Code
          Write-Host "Instalando VS Code..."
          winget install --id Microsoft.VisualStudioCode -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity

      - name: Restaurar archivos desde Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if ([string]::IsNullOrEmpty($env:RCLONE_CONFIG_DATA)) {
            Write-Error "El secret RCLONE_CONFIG está vacío"
            exit 1
          }
          
          Set-Content -Path "C:\rclone.conf" -Value $env:RCLONE_CONFIG_DATA -Encoding UTF8
          Write-Host "Config de rclone creado"
          
          $rdpProfile = "C:\Users\RDP"
          
          $folders = @(
            "$rdpProfile\AppData\Roaming\Mozilla\Firefox",
            "$rdpProfile\AppData\Roaming\Code\User",
            "$rdpProfile\Desktop",
            "$rdpProfile\Documents",
            "$rdpProfile\.vscode\extensions"
          )
          
          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
          }
          
          Write-Host "Iniciando restauración desde Google Drive..."
          
          & "C:\rclone\rclone.exe" copy "gdrive:Backup_GitHub_PC/Firefox_Roaming" "$rdpProfile\AppData\Roaming\Mozilla\Firefox" --config "C:\rclone.conf" --create-empty-src-dirs -v --transfers 8
          & "C:\rclone\rclone.exe" copy "gdrive:Backup_GitHub_PC/VSCode_User" "$rdpProfile\AppData\Roaming\Code\User" --config "C:\rclone.conf" --create-empty-src-dirs -v --transfers 8
          & "C:\rclone\rclone.exe" copy "gdrive:Backup_GitHub_PC/Desktop" "$rdpProfile\Desktop" --config "C:\rclone.conf" --create-empty-src-dirs -v --transfers 8
          & "C:\rclone\rclone.exe" copy "gdrive:Backup_GitHub_PC/Documents" "$rdpProfile\Documents" --config "C:\rclone.conf" --create-empty-src-dirs -v --transfers 8
          
          Write-Host "Restauración terminada"
          
          # Permisos al usuario RDP
          icacls "$rdpProfile" /grant "RDP:(OI)(CI)F" /T /Q
          
          # Instalar extensiones de VS Code si existe el archivo
          if (Test-Path "$rdpProfile\Desktop\vscode_extensions.txt") {
            Write-Host "Instalando extensiones de VS Code..."
            Get-Content "$rdpProfile\Desktop\vscode_extensions.txt" | ForEach-Object {
              $ext = $_.Trim()
              if ($ext) {
                & "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd" --extensions-dir "$rdpProfile\.vscode\extensions" --install-extension $ext --force
              }
            }
          }

      - name: Programar backup automático cada 30 minutos
        run: |
          $script = @'
          $rdpProfile = "C:\Users\RDP"
          while ($true) {
            Start-Sleep -Seconds 1800
            try {
              & "C:\rclone\rclone.exe" sync "$rdpProfile\Desktop" "gdrive:Backup_GitHub_PC/Desktop" --config "C:\rclone.conf" --max-size 100M --transfers 4
              & "C:\rclone\rclone.exe" sync "$rdpProfile\Documents" "gdrive:Backup_GitHub_PC/Documents" --config "C:\rclone.conf" --max-size 100M --transfers 4
              & "C:\rclone\rclone.exe" sync "$rdpProfile\AppData\Roaming\Code\User" "gdrive:Backup_GitHub_PC/VSCode_User" --config "C:\rclone.conf" --transfers 4
              Write-Host "$(Get-Date) - Backup automático realizado"
            } catch {
              Write-Host "$(Get-Date) - Error en backup: $_"
            }
          }
          '@
          Set-Content -Path "C:\backup_auto.ps1" -Value $script
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -File C:\backup_auto.ps1"
          Write-Host "Backup automático iniciado"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) { Start-Sleep -Seconds 5; $retries++ }
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "No se pudo conectar al puerto 3389"
              exit 1
          }
          Write-Host "Conexión RDP lista"

      - name: Maintain Connection
        run: |
          Write-Host "`n========================================"
          Write-Host "=== DATOS DE ACCESO RDP ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "========================================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
